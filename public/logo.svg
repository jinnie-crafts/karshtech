<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="emberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7454" />
      <stop offset="100%" stop-color="#FF5A36" />
    </linearGradient>
    <linearGradient id="charcoalSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242329" />
      <stop offset="100%" stop-color="#1A191F" />
    </linearGradient>
  </defs>

  <!-- Background Base Container -->
  <rect x="6" y="6" width="88" height="88" rx="16" fill="#101014" stroke="#39363A" stroke-width="2.5" />

  <!-- Inner Charcoal Geometric Panel -->
  <rect x="14" y="14" width="72" height="72" rx="10" fill="url(#charcoalSurface)" stroke="#39363A" stroke-width="1.5" />

  <!-- Geometric Studio Brand Mark: Stylized Kinetic "K" with Ember Arrow/Apex -->
  <!-- Left Pillar -->
  <rect x="28" y="28" width="10" height="44" rx="3" fill="#F4F0E8" />

  <!-- Upper Diagonal Wing -->
  <path d="M42 50 L64 28 H76 L52 50 Z" fill="#F4F0E8" />

  <!-- Lower Kinetic Ember Arrow Wing (Studio Signature) -->
  <path d="M48 46 L74 72 H60 L38 52 Z" fill="url(#emberGlow)" />

  <!-- Center Ember Focal Point -->
  <circle cx="48" cy="50" r="3" fill="#FF5A36" />
</svg>
